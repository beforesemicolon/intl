<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scoped Intl example</title>
  <script src="/app.bundle.js" defer></script>
</head>
<body>
  <intl-locale locale="en" fallback-locale="en" src-dir="/locales" fallback update-document>
    <main>
      <h1><intl-msg key="home.title">Welcome</intl-msg></h1>
      <p><intl-msg key="home.note">Thank you for visiting.</intl-msg></p>
    </main>
  </intl-locale>
  <label for="language">Language</label>
  <select id="language">
    <option value="en">English</option>
    <option value="pt">Português</option>
  </select>
  <p id="locale-status" role="status"></p>
</body>
</html>
