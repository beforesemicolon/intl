name: Diagnose web-component compatibility

on:
  push:
    branches:
      - agent/intl-web-component-fix-2
    paths-ignore:
      - diagnostics/**

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Capture failing test output
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics
          npm test -- --runInBand > diagnostics/full-test-output.txt 2>&1
          status=$?
          {
            echo "exit_code=$status"
            echo
            grep -n -E "FAIL|Expected:|Received:|TypeError|ReferenceError|Error:|Test Suites:|Tests:|Snapshot" diagnostics/full-test-output.txt | tail -n 250 || true
            echo
            echo "--- tail ---"
            tail -n 300 diagnostics/full-test-output.txt
          } > diagnostics/test-failure.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/test-failure.txt
          git commit -m "chore: capture compatibility test failure" || true
          git push || true
          exit $status
