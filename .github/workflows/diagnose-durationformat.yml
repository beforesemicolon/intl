name: Diagnose durationformat compatibility

on:
  push:
    branches:
      - agent/intl-durationformat-0.10
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run focused diagnostics
        id: test
        shell: bash
        run: |
          set +e
          npm test -- --runInBand > test-output.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: durationformat-test-output-${{ matrix.node }}
          path: test-output.log
      - name: Print failure summary
        if: steps.test.outputs.status != '0'
        shell: bash
        run: |
          grep -n -E "FAIL|Expected:|Received:|TypeError|ReferenceError|Error:|●|Test Suites:|Tests:" test-output.log | tail -n 160 || true
          tail -n 120 test-output.log
          exit 1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
